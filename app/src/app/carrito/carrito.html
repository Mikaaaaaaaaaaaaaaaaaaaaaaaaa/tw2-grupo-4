
<!-- Botón para abrir el carrito -->
<button
  class="cart-trigger"
  type="button"
  (click)="abrirCarrito()"
  aria-label="Abrir carrito de compras">

<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart-fill" viewBox="0 0 16 16">
  <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
</svg>

  <span>Carrito</span>
</button>

<div
  class="cart-overlay"
  *ngIf="carritoAbierto"
  (click)="cerrarCarrito()">

  <!-- Panel lateral -->
  <aside
    class="cart-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cart-title"
    (click)="$event.stopPropagation()">

    <!-- Encabezado -->
    <header class="cart-header">
      <h2 id="cart-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart-fill" viewBox="0 0 16 16">
            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
        </svg>

        Carrito de Compras
      </h2>

      <button
        class="close-button"
        type="button"
        (click)="cerrarCarrito()"
        aria-label="Cerrar carrito">

        <svg
          width="23"
          height="23"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </header>

    <!-- Cuando esta vacio -->
    <main class="cart-content">
      <div class="empty-cart">

        <div class="empty-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart-dash-fill" viewBox="0 0 16 16">
                <path d="M.5 1a.5.5 0 0 0 0 1h1.11l.401 1.607 1.498 7.985A.5.5 0 0 0 4 12h1a2 2 0 1 0 0 4 2 2 0 0 0 0-4h7a2 2 0 1 0 0 4 2 2 0 0 0 0-4h1a.5.5 0 0 0 .491-.408l1.5-8A.5.5 0 0 0 14.5 3H2.89l-.405-1.621A.5.5 0 0 0 2 1zM6 14a1 1 0 1 1-2 0 1 1 0 0 1 2 0m7 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0M6.5 7h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 1 0-1"/>
            </svg>
        </div>

        <p>Tu carrito está vacío</p>

      </div>
    </main>

    <!-- Resumen de compra -->
    <footer class="cart-footer">

      <div class="summary-row">
        <span>Subtotal</span>
        <strong>$0.00</strong>
      </div>

      <div class="summary-row">
        <span>Envío (Nacional)</span>
        <strong class="free-shipping">¡GRATIS!</strong>
      </div>

      <div class="summary-row">
        <span>Impuestos IVA (21%)</span>
        <strong>$0.00</strong>
      </div>

      <div class="summary-total">
        <span>Total Final</span>
        <strong>$0.00</strong>
      </div>

      <button
        class="checkout-button"
        type="button">

        Finalizar Compra

        <svg
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <path d="M5 12h14"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
        

      </button>

    </footer>

  </aside>
</div>
