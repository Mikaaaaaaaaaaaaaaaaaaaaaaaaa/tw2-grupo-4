<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4" routerLink="/">

  <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-2xl p-6 sm:p-8" (click)="$event.stopPropagation()">

    <a routerLink="/" aria-label="Cerrar" class="absolute top-5 right-6 text-slate-400 hover:text-slate-600 transition-colors">
      <i class="fa-solid fa-xmark text-xl"></i>
    </a>

    @if (producto) {
      <div class="flex flex-col sm:flex-row gap-6">

        <img [src]="producto.imagen" [alt]="producto.nombre"
             class="w-full sm:w-72 aspect-square object-cover rounded-2xl shrink-0">

        <div class="flex flex-col justify-center flex-1 space-y-3 pt-4 sm:pt-6">
          <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-600">{{ producto.categoria }}</span>

          <h2 class="text-2xl font-extrabold text-slate-900 leading-tight">{{ producto.nombre }}</h2>

          <div class="flex items-center gap-2 text-sm">
            <i class="fa-solid fa-star text-amber-400"></i>
            <span class="font-bold text-amber-500">{{ producto.rating }}</span>
            <span class="text-slate-400 text-xs">(128 reseñas de alumnos)</span>
          </div>

          <p class="text-sm text-slate-500 leading-relaxed">{{ producto.descripcion }}</p>

          <div class="bg-slate-50 border border-slate-200 rounded-xl p-4">
            <span class="text-xs text-slate-400 block">Precio final</span>
            <span class="text-3xl font-extrabold text-slate-900">${{ producto.precio.toFixed(2) }}</span>
          </div>

          <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl py-3 shadow-lg shadow-indigo-500/30 active:scale-95 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-cart-plus"></i>
            Agregar al Carrito
          </button>
        </div>

      </div>
    } @else {
      <p class="text-center text-slate-500 py-10">Producto no encontrado</p>
    }

  </div>
</div>
