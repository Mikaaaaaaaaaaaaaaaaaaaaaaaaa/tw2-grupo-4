<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" (click)="cerrarModal()">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-6 relative shadow-2xl border border-slate-100" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">

    <button type="button" (click)="cerrarModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-2 text-xl leading-none" aria-label="Cerrar">&#10005;</button>

    <!-- pestañas -->
    <div class="flex border-b border-slate-200">
      <button type="button" (click)="cambiarPestana('login')"
        [class]="pestana === 'login' ? 'flex-1 py-3 text-center text-sm font-bold text-indigo-600 border-b-2 border-indigo-600' : 'flex-1 py-3 text-center text-sm font-semibold text-slate-400 hover:text-slate-600'">
        Iniciar Sesión
      </button>
      <button type="button" (click)="cambiarPestana('register')"
        [class]="pestana === 'register' ? 'flex-1 py-3 text-center text-sm font-bold text-indigo-600 border-b-2 border-indigo-600' : 'flex-1 py-3 text-center text-sm font-semibold text-slate-400 hover:text-slate-600'">
        Crear Cuenta
      </button>
    </div>

    <!-- login -->
    <form *ngIf="pestana === 'login'" [formGroup]="formularioLogin" (ngSubmit)="enviarLogin()" class="space-y-4" novalidate>
      <div>
        <label for="login_email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Correo Electrónico</label>
        <input id="login_email" type="email" formControlName="email" placeholder="tuusuario@unlam.edu.ar"
          class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-indigo-500 focus:border-indigo-500">
        <p *ngIf="tieneError(formularioLogin, 'email')" class="text-xs text-red-600 mt-1">Ingresá un correo válido.</p>
      </div>

      <div>
        <label for="login_password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
        <input id="login_password" type="password" formControlName="password" placeholder="••••••••"
          class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-indigo-500 focus:border-indigo-500">
        <p *ngIf="tieneError(formularioLogin, 'password')" class="text-xs text-red-600 mt-1">Ingresá tu contraseña.</p>
      </div>

      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-2 text-slate-600">
          <input type="checkbox" formControlName="recordar" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"> Recordarme
        </label>
        <a href="#" class="text-indigo-600 hover:underline font-medium">¿Olvidaste tu clave?</a>
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-md shadow-indigo-500/20">
        Ingresar a la Plataforma
      </button>
    </form>

    <!-- registro -->
    <form *ngIf="pestana === 'register'" [formGroup]="formularioRegistro" (ngSubmit)="enviarRegistro()" class="space-y-4" novalidate>
      <div>
        <label for="reg_nombre" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Nombre Completo</label>
        <input id="reg_nombre" type="text" formControlName="nombre" placeholder="Juan Pérez"
          class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-indigo-500 focus:border-indigo-500">
        <p *ngIf="tieneError(formularioRegistro, 'nombre')" class="text-xs text-red-600 mt-1">Ingresá tu nombre.</p>
      </div>

      <div>
        <label for="reg_email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Correo Electrónico</label>
        <input id="reg_email" type="email" formControlName="email" placeholder="juan@ejemplo.com"
          class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-indigo-500 focus:border-indigo-500">
        <p *ngIf="tieneError(formularioRegistro, 'email')" class="text-xs text-red-600 mt-1">Ingresá un correo válido.</p>
      </div>

      <div>
        <label for="reg_password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
        <input id="reg_password" type="password" formControlName="password" placeholder="Mínimo 6 caracteres"
          class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-indigo-500 focus:border-indigo-500">
        <p *ngIf="tieneError(formularioRegistro, 'password')" class="text-xs text-red-600 mt-1">La contraseña debe tener al menos 6 caracteres.</p>
      </div>

      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-md shadow-emerald-500/20">
        Crear Cuenta
      </button>
    </form>
  </div>
</div>
